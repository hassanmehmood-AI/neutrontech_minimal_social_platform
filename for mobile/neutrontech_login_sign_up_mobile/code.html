<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>NeutronTech - Access Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                    "inverse-surface": "#2f2f3b",
                    "on-surface": "#1a1b25",
                    "secondary": "#545f72",
                    "surface-container-highest": "#e3e1f0",
                    "on-secondary-fixed-variant": "#3c475a",
                    "surface-container-low": "#f4f2ff",
                    "background": "#fbf8ff",
                    "error-container": "#ffdad6",
                    "tertiary-fixed-dim": "#ffb4a6",
                    "primary-fixed-dim": "#bec2ff",
                    "outline": "#757589",

                    "tertiary-container": "#a91300",

                    "tertiary": "#7e0b00",
                    "surface-container": "#eeecfc",
                    "tertiary-fixed": "#ffdad4",
                    "secondary-fixed": "#d8e3fa",
                    "on-error": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "error": "#ba1a1a",
                    "inverse-on-surface": "#f1efff",
                    "inverse-primary": "#bec2ff",
                    "on-error-container": "#93000a",
                    "secondary-fixed-dim": "#bcc7dd",
                    "on-tertiary-fixed-variant": "#900e00",
                    "surface-dim": "#dad8e8",

                    "primary": "#0010cc",
                    "on-background": "#1a1b25"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "1.5rem",
                    "margin-mobile": "16px",
                    "lg": "2rem",
                    "base": "4px",
                    "margin-desktop": "32px",
                    "gutter": "24px",
                    "xs": "0.5rem",
                    "xl": "4rem",
                    "sm": "1rem"
            },
            "fontFamily": {
                    "headline-md": ["Geist"],
                    "headline-lg-mobile": ["Geist"],
                    "label-md": ["Geist"],
                    "headline-lg": ["Geist"],
                    "body-lg": ["Inter"],
                    "label-sm": ["Geist"],
                    "body-md": ["Inter"],
                    "display": ["Geist"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],

                    "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}]

          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .auth-card {
            box-shadow: 0px 4px 20px rgba(10, 17, 40, 0.05);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .tap-scale:active {
            transform: scale(0.98);
        }
        .transition-height {
            transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Top Navigation Shell Suppressed per "Relevance Check" and "The Destination Rule" for Transactional Screens -->
<main class="w-full max-w-md mx-auto flex flex-col items-center space-y-xl">
<!-- Header Section -->
<header class="text-center space-y-sm">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container rounded-xl shadow-lg mb-md">
<span class="material-symbols-outlined text-white text-3xl" data-icon="bolt">bolt</span>
</div>
<h1 class="font-display text-display text-primary tracking-tight">NeutronTech</h1>
<p class="font-label-md text-label-md text-on-surface-variant">The future of social innovation.</p>
</header>
<!-- Auth Container -->
<div class="w-full bg-surface-container-lowest rounded-xl border border-outline-variant p-md auth-card">
<!-- Toggle Control -->
<div class="flex p-xs bg-surface-container-low rounded-lg mb-lg gap-xs">
<button class="flex-1 py-xs rounded-md font-label-md text-label-md transition-all bg-surface-container-highest text-primary shadow-sm" id="loginToggle" onclick="toggleAuth('login')">
                    Login
                </button>
<button class="flex-1 py-xs rounded-md font-label-md text-label-md transition-all text-on-surface-variant" id="signupToggle" onclick="toggleAuth('signup')">
                    Sign Up
                </button>
</div>
<form class="space-y-md" id="authForm">
<!-- Name Field (Signup Only) -->
<div class="hidden opacity-0 overflow-hidden transition-height max-h-0" id="nameField">
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="full_name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-xl pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md" id="full_name" placeholder="John Doe" type="text">
</div>
</div>
<!-- Username Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="alternate_email">alternate_email</span>
<input class="w-full pl-xl pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md" id="username" placeholder="neutron_user" type="text">
</div>
</div>
<!-- Email Field (Signup Only) -->
<div class="hidden opacity-0 overflow-hidden transition-height max-h-0" id="emailField">
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-xl pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md" id="email" placeholder="hello@neutrontech.io" type="email">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-xl pr-12 py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md" id="password" placeholder="••••••••" type="password">
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-primary tap-scale" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- CTA -->
<button class="w-full py-md bg-primary-container text-white font-label-md text-label-md rounded-lg shadow-md tap-scale active:scale-95 transition-all mt-lg hover:brightness-110" type="submit">
<span id="submitText">Sign In</span>
</button>
</form>
<div class="mt-md text-center">
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
</div>
<!-- Social Proof/Footer Section -->
<footer class="w-full space-y-md">
<div class="flex items-center gap-sm">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-outline">OR CONTINUE WITH</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-xs py-sm border border-outline-variant rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-all tap-scale">
<img alt="Google" class="w-4 h-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAdBPxkdAzVwe-AtJlEiJDl0tYQz-iAWI0ZmhkHJc0G_SD1KjcT5lHBfCim9YFpLCH3Axfro-vh2oYcHTNjHomIf410GhiWiB86ZjPYf7eGyzn_l4QkRoTBaUKumRN5vfU130O10LfvlqTr_ROfbPp0bordKU-0Y8PUirhtMp9vMJE2FpOBj1XbA1KU0gc6Cs3WyCntC97R6T6-gumTOBsAMTZTumwmaKW7l0YLvRi9JMD47lRLu0-ea7uGHF_7dweNvh0eO1gBfA8">
                    Google
                </button>
<button class="flex items-center justify-center gap-xs py-sm border border-outline-variant rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-all tap-scale">
<span class="material-symbols-outlined text-black" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
                    Apple
                </button>
</div>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant px-md leading-relaxed">
                By continuing, you agree to NeutronTech's 
                <a class="text-primary hover:underline" href="#">Terms of Service</a> and 
                <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
            </p>
</footer>
</main>
<!-- Background Decorative Element (Atmospheric Only) -->
<div class="fixed -top-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="fixed -bottom-24 -left-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<script>
        function toggleAuth(mode) {
            const loginToggle = document.getElementById('loginToggle');
            const signupToggle = document.getElementById('signupToggle');
            const nameField = document.getElementById('nameField');
            const emailField = document.getElementById('emailField');
            const submitText = document.getElementById('submitText');

            if (mode === 'signup') {
                signupToggle.classList.add('bg-surface-container-highest', 'text-primary', 'shadow-sm');
                loginToggle.classList.remove('bg-surface-container-highest', 'text-primary', 'shadow-sm');
                loginToggle.classList.add('text-on-surface-variant');
                
                nameField.classList.remove('hidden');
                emailField.classList.remove('hidden');
                setTimeout(() => {
                    nameField.classList.remove('opacity-0', 'max-h-0');
                    emailField.classList.remove('opacity-0', 'max-h-0');
                    nameField.classList.add('max-h-32', 'opacity-100');
                    emailField.classList.add('max-h-32', 'opacity-100');
                }, 10);
                
                submitText.textContent = 'Create Account';
            } else {
                loginToggle.classList.add('bg-surface-container-highest', 'text-primary', 'shadow-sm');
                signupToggle.classList.remove('bg-surface-container-highest', 'text-primary', 'shadow-sm');
                signupToggle.classList.add('text-on-surface-variant');

                nameField.classList.add('opacity-0', 'max-h-0');
                emailField.classList.add('opacity-0', 'max-h-0');
                nameField.classList.remove('opacity-100', 'max-h-32');
                emailField.classList.remove('opacity-100', 'max-h-32');
                
                setTimeout(() => {
                    nameField.classList.add('hidden');
                    emailField.classList.add('hidden');
                }, 400);

                submitText.textContent = 'Sign In';
            }
        }

        // Add visual interest to interactions
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-primary');
            });
        });
    </script>
</body></html>
